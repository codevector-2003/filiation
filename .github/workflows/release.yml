# Publishes a release when a version tag is pushed: git tag v0.1.0 && git push origin v0.1.0
#
# Builds happen here, on a clean runner, rather than on anyone's laptop, so
# every published binary comes from the tagged commit and nothing else.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload its assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog needs history

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Windows installer: the desktop app and fil, for the current user
  # (D37). It is added to the release GoReleaser has just made.
  windows-installer:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Build and attach the installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $setup = pwsh desktop/installer/build.ps1 -Version $tag.TrimStart('v') | Select-Object -Last 1
          gh release upload $tag $setup --clobber
          # GoReleaser wrote checksums.txt before the installer existed. The
          # app checks the installer against it before running it (D38), so
          # its line is added, replacing any from an earlier run of this job.
          $name = Split-Path $setup -Leaf
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          New-Item -ItemType Directory -Force sums | Out-Null
          gh release download $tag -p checksums.txt -D sums --clobber
          $lines = @(Get-Content sums/checksums.txt | Where-Object { $_ -and -not $_.EndsWith("  $name") })
          $lines += "$hash  $name"
          [IO.File]::WriteAllText("$PWD/sums/checksums.txt", ($lines -join "`n") + "`n")
          gh release upload $tag sums/checksums.txt --clobber

  # The website names the newest release and links to its installer; publish
  # it again now the release is complete (pages.yml).
  website:
    needs: windows-installer
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Deploy the website
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
